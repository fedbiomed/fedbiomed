---
name: Build and Push a Docker Image
description: Publish docker images

inputs:
  image-names:
    description: Image names used as base for the generated tags
    required: true

  file:
    description: Path to the docker file
    required: true

  test:
    description: Only builds images without pushing
    required: false
    default: 'true'

  python-version:
    description: Python version used by the image
    required: false
    default: '3.11'

runs:
  using: composite
  steps:
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        # list of Docker images to use as base name for tags
        images: ${{ inputs.image-names }}
        # generate Docker tags based on the following events/attributes
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
        flavor: |
          latest=false

    # Images are built into the local image store: node and researcher images
    # are built `FROM` the base image produced by an earlier step of the same job.
    - name: Build the image
      shell: bash
      env:
        IMAGE_NAMES: ${{ inputs.image-names }}
        TAGS: ${{ steps.meta.outputs.tags }}
        LABELS: ${{ steps.meta.outputs.labels }}
        VERSION: ${{ steps.meta.outputs.version }}
        DOCKERFILE: ${{ inputs.file }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail

        TAG_ARGS=()
        while IFS= read -r tag; do
          if [[ -n "$tag" ]]; then
            TAG_ARGS+=(-t "$tag")
          fi
        done <<< "$TAGS"

        if [[ ${#TAG_ARGS[@]} -eq 0 ]]; then
          echo "No tag was generated for $IMAGE_NAMES" >&2
          exit 1
        fi

        LABEL_ARGS=()
        while IFS= read -r label; do
          if [[ -n "$label" ]]; then
            LABEL_ARGS+=(--label "$label")
          fi
        done <<< "$LABELS"

        docker build "${TAG_ARGS[@]}" "${LABEL_ARGS[@]}" \
          --build-arg FBM_IMAGE_VERSION="$VERSION" \
          --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
          -f "$DOCKERFILE" .

    # Only an explicit `false` publishes, so an unset or unexpected `test` value
    # keeps the images out of the registry.
    - name: Push the image
      if: inputs.test == 'false'
      shell: bash
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        set -euo pipefail
        while IFS= read -r tag; do
          if [[ -n "$tag" ]]; then
            docker push "$tag"
          fi
        done <<< "$TAGS"
