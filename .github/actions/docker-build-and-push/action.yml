name: Build and Push a Docker Image
description: Publish docker images

inputs: 
  image-names:
    description: List of tags to push
    required: true
  
  file:
    description: Path to the docker file
    required: true
  
  test:
    description: Only builds images without pushing
    required: false
    default: 'false'

  image-tag:
    description: |
      Explicit tag to publish under (from workflow_dispatch). When set, this
      is the only tag used, overriding the branch/sha tags below.
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        # list of Docker images to use as base name for tags
        images: ${{ inputs.image-names }}
        # A version tag produces the three semver tags. A manual run from a
        # branch produces the branch name and commit sha, unless image-tag
        # overrides them with a single explicit tag.
        tags: |
          type=ref,event=branch,enable=${{ inputs.image-tag == '' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,enable=${{ inputs.image-tag == '' }}
          type=raw,value=${{ inputs.image-tag }},enable=${{ inputs.image-tag != '' }}
        flavor: |
          latest=false
    
    - name: Info
      run: |
        echo "${{ steps.meta.outputs.tags }}"
        echo "${{ steps.meta.outputs.labels }}"
      shell: bash -l {0}

    - name: Generate docker tag args (no jq)
      id: tag-args
      run: |
        TAG_ARGS=""
        while IFS= read -r tag; do
          [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"
        done <<< "${{ steps.meta.outputs.tags }}"
        echo "TAG_ARGS=$TAG_ARGS" >> $GITHUB_OUTPUT
      shell: bash -l {0}

    - name: Set up QEMU
      if: ${{ inputs.test == false || inputs.test == 'false' }}
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      # Only for publishing: this creates a docker-container driver builder
      # (an isolated BuildKit instance) to get QEMU multi-platform support.
      # That builder can't see the runner's Docker daemon image store, so a
      # test build's `--load` result wouldn't be visible to the next stage's
      # `FROM fedbiomed/base:...` if this ran unconditionally. Test builds
      # stay on the runner's default docker-driver builder instead, which
      # shares the daemon store and needs no setup.
      if: ${{ inputs.test == false || inputs.test == 'false' }}
      uses: docker/setup-buildx-action@v3

    - name: Build (and push) the image
      run: |
        # Publishing builds both platforms and pushes straight from buildx,
        # since a multi-platform result cannot be loaded into the local
        # image store. Test builds stay single-platform (native runner arch)
        # and load locally, so a later stage's `FROM fedbiomed/base:...` in
        # this same job still resolves to the image just built, unpushed.
        if [[ "${{ inputs.test }}" == "false" ]]; then
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            ${{ steps.tag-args.outputs.TAG_ARGS }} \
            --build-arg FBM_IMAGE_VERSION=${{ steps.meta.outputs.version }} \
            -f ${{ inputs.file }} \
            --push \
            .
        else
          docker buildx build \
            ${{ steps.tag-args.outputs.TAG_ARGS }} \
            --build-arg FBM_IMAGE_VERSION=${{ steps.meta.outputs.version }} \
            -f ${{ inputs.file }} \
            --load \
            .
        fi
      shell: bash -l {0}

    # BuildKit keeps every intermediate layer of every platform in its cache:
    # the wheel directory and the unpacked image layers, per platform, for a
    # torch-sized image. Three of these in one job do not fit on the runner.
    # Nothing here is reused by the next image either - docker/node and
    # docker/researcher start FROM the base *image*, which prune does not
    # touch, not from its build cache.
    - name: Prune the build cache
      if: always()
      run: |
        docker buildx prune --all --force || true
        docker builder prune --all --force || true
        df -h /
      shell: bash -l {0}
