---
name: Setup Fed-BioMed Test Environment
description: Install the requested Python interpreter and tox

inputs:
  python-version:
    description: Python version to install
    required: true

runs:
  using: composite
  steps:
    - name: Detect runner package manager
      id: runner
      shell: bash -l {0}
      run: |
        set -euo pipefail
        if [[ "${{ runner.environment }}" == "self-hosted" && \
              "${{ runner.os }}" == "macOS" ]]; then
          PACKAGE_MANAGER=brew
        elif command -v dnf >/dev/null; then
          PACKAGE_MANAGER=dnf
        else
          PACKAGE_MANAGER=setup-python
        fi

        echo "Installing Python with $PACKAGE_MANAGER"
        echo "package_manager=$PACKAGE_MANAGER" >> "$GITHUB_OUTPUT"

    - name: Install Python with setup-python
      id: setup_python
      if: steps.runner.outputs.package_manager == 'setup-python'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          tox.ini

    - name: Install Python with dnf
      if: steps.runner.outputs.package_manager == 'dnf'
      shell: bash -l {0}
      run: |
        set -euo pipefail
        sudo dnf install -y "python${{ inputs.python-version }}"
        PYTHON_BIN=$(command -v "python${{ inputs.python-version }}")
        echo "FEDBIOMED_PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"

    - name: Install Python with Homebrew
      if: steps.runner.outputs.package_manager == 'brew'
      shell: bash -l {0}
      run: |
        set -euo pipefail
        VERSION="${{ inputs.python-version }}"
        if ! arch -arm64 brew list --versions "python@$VERSION" >/dev/null; then
          arch -arm64 brew install "python@$VERSION"
        fi

        PYTHON_PREFIX=$(arch -arm64 brew --prefix "python@$VERSION")
        echo "FEDBIOMED_PYTHON_BIN=$PYTHON_PREFIX/bin/python$VERSION" >> "$GITHUB_ENV"
        echo "$PYTHON_PREFIX/bin" >> "$GITHUB_PATH"
        echo "$PYTHON_PREFIX/libexec/bin" >> "$GITHUB_PATH"

    - name: Validate Python installation
      shell: bash -l {0}
      run: |
        set -euo pipefail
        PYTHON_BIN="${FEDBIOMED_PYTHON_BIN:-${{ steps.setup_python.outputs.python-path }}}"
        if [[ -z "$PYTHON_BIN" ]]; then
          echo "No installation step ran for package manager" \
               "${{ steps.runner.outputs.package_manager }} on ${{ runner.os }}." >&2
          exit 1
        fi
        ACTUAL=$("$PYTHON_BIN" -c 'import sys; print("%d.%d" % sys.version_info[:2])')
        if [[ "$ACTUAL" != "${{ inputs.python-version }}" ]]; then
          echo "Expected Python ${{ inputs.python-version }}, found $ACTUAL at $PYTHON_BIN" >&2
          exit 1
        fi
        RESOLVED=$("$PYTHON_BIN" -c 'import os, sys; print(os.path.realpath(sys.executable))')
        echo "Python $ACTUAL at $RESOLVED"
        echo "FEDBIOMED_PYTHON_BIN=$RESOLVED" >> "$GITHUB_ENV"

    # Torch ships CUDA runtime wheels (~3.8 GB) on Linux x86_64 whether or not the
    # machine has a GPU, and no test selects the CUDA code path. Setting
    # PIP_EXTRA_INDEX_URL beforehand opts back into the CUDA build. tox forwards
    # the variable through its default PIP_* pass_env.
    - name: Select CPU-only torch on Linux
      if: runner.os == 'Linux'
      shell: bash -l {0}
      run: |
        set -euo pipefail
        if [[ -z "${PIP_EXTRA_INDEX_URL:-}" ]]; then
          echo "Using CPU-only torch wheels."
          echo "PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu" >> "$GITHUB_ENV"
        fi

    - name: Install tox
      shell: bash -l {0}
      run: |
        set -euo pipefail
        TOX_VENV=$(mktemp -d "${RUNNER_TEMP:-/tmp}/fedbiomed-tox-XXXXXXXX")
        "$FEDBIOMED_PYTHON_BIN" -m venv "$TOX_VENV"
        "$TOX_VENV/bin/python" -m pip install tox
        "$TOX_VENV/bin/tox" --version
        echo "$TOX_VENV/bin" >> "$GITHUB_PATH"
