---
name: Fed-BioMed Docker Compatibility Tests
run-name: Fed-BioMed Docker Compatibility Tests
description: |
  Builds the published docker images on every supported interpreter.

on:
  schedule:
    # Monday to Friday at 20:00 UTC.
    - cron: "0 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-build-smoke:
    name: Build smoke (ubuntu-latest, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            python-tag: "311"
          - python-version: "3.12"
            python-tag: "312"
          - python-version: "3.13"
            python-tag: "313"
          - python-version: "3.14"
            python-tag: "314"
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}-py${{ matrix.python-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build base image
        run: |
          docker build --build-arg "PYTHON_VERSION=$PYTHON_VERSION" \
            --tag "fedbiomed/base:$IMAGE_TAG" --file docker/base/Dockerfile .

      - name: Build node and researcher images
        run: |
          for image in node researcher; do
            docker build \
              --build-arg "FBM_IMAGE_VERSION=$IMAGE_TAG" \
              --build-arg "PYTHON_VERSION=$PYTHON_VERSION" \
              --tag "fedbiomed/$image:$IMAGE_TAG" \
              --file "docker/$image/Dockerfile" .
          done

      - name: Verify image Python and commands
        run: |
          for image in base node researcher; do
            actual=$(docker run --rm --entrypoint python "fedbiomed/$image:$IMAGE_TAG" -c \
              'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
            test "$actual" = "$PYTHON_VERSION"
          done

          docker run --rm --entrypoint fedbiomed "fedbiomed/base:$IMAGE_TAG" --help
          docker run --rm --entrypoint fedbiomed "fedbiomed/node:$IMAGE_TAG" node --help
          docker run --rm --entrypoint fedbiomed \
            "fedbiomed/researcher:$IMAGE_TAG" researcher --help

      - name: Remove test images
        if: always()
        run: |
          docker image rm --force "fedbiomed/researcher:$IMAGE_TAG" \
            "fedbiomed/node:$IMAGE_TAG" "fedbiomed/base:$IMAGE_TAG" || true

