---
name: Package Build Test
run-name: Package Build Test
# Tests install the exact wheels that deploy.yml publishes.

on:
  workflow_call:
    outputs:
      artifact-id:
        description: ID of the artifact containing all six distributions
        value: ${{ jobs.build-package.outputs.artifact-id }}
  workflow_dispatch:
  schedule:
    # Monday at 03:00 UTC.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  build-package:
    name: Build packages (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build each source distribution and its wheel
        shell: bash
        run: |
          for package in fedbiomed node-api node-ui; do
            python -m build --outdir "$PWD/dist" "packages/$package"
          done

      - name: Validate distributions
        shell: bash
        run: |
          python -m twine check dist/*
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 3
          test "${#sdists[@]}" -eq 3
          for package in fedbiomed fedbiomed_node_api fedbiomed_gui; do
            wheels=(dist/"$package"-*.whl)
            sdists=(dist/"$package"-*.tar.gz)
            test "${#wheels[@]}" -eq 1
            test "${#sdists[@]}" -eq 1
            test "${wheels[0]}" = "${sdists[0]%.tar.gz}-py3-none-any.whl"
          done

      - name: Upload package artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: fedbiomed-package-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

  test-wheel:
    name: Wheel (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
          - macos-latest
          - macos-m1
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup requested Python
        uses: ./.github/actions/setup-fbm-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-package.outputs.artifact-id || 'missing-artifact-id' }}
          path: dist/
          merge-multiple: true

      - name: Install the three uploaded wheels in a clean environment
        run: |
          set -euo pipefail
          VENV_DIR=$(mktemp -d "$RUNNER_TEMP/fedbiomed-wheel-XXXXXXXX")
          "$FEDBIOMED_PYTHON_BIN" -m venv "$VENV_DIR"
          VENV_PYTHON="$VENV_DIR/bin/python"
          echo "VENV_PYTHON=$VENV_PYTHON" >> "$GITHUB_ENV"

          "$VENV_PYTHON" -c 'import sys; print("Venv Python:", sys.executable, sys.version)'
          "$VENV_PYTHON" -m pip install --upgrade pip
          core_wheel=("$GITHUB_WORKSPACE"/dist/fedbiomed-*.whl)
          "$VENV_PYTHON" -m pip install \
            "${core_wheel[0]}[node,node-api,gui,researcher]" \
            "$GITHUB_WORKSPACE"/dist/fedbiomed_node_api-*.whl \
            "$GITHUB_WORKSPACE"/dist/fedbiomed_gui-*.whl

      - name: Verify installed wheels
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          "$VENV_PYTHON" -m pip check
          "$(dirname "$VENV_PYTHON")/fedbiomed" --help
          "$(dirname "$VENV_PYTHON")/fedbiomed-node-api" --help
          "$(dirname "$VENV_PYTHON")/fedbiomed-ui" --help
          "$VENV_PYTHON" - <<'PY'
          import os
          import sys
          from importlib.metadata import distribution
          from pathlib import Path

          import fedbiomed
          import fedbiomed_gui
          import fedbiomed_node_api
          from fedbiomed.common.utils import SHARE_DIR

          expected_python = os.environ["EXPECTED_PYTHON"]
          actual_python = f"{sys.version_info.major}.{sys.version_info.minor}"
          assert actual_python == expected_python, (
              f"Expected Python {expected_python}, found {actual_python}"
          )

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          versions = {}
          for name, module in (
              ("fedbiomed", fedbiomed),
              ("fedbiomed-node-api", fedbiomed_node_api),
              ("fedbiomed-gui", fedbiomed_gui),
          ):
              package_file = Path(module.__file__).resolve()
              assert package_file.is_relative_to(Path(sys.prefix).resolve()), (
                  f"Imported {name} from outside the virtual environment: {package_file}"
              )
              assert workspace not in package_file.parents, package_file
              versions[name] = distribution(name).version
              print(f"Installed {name} {versions[name]}: {package_file}")
          assert len(set(versions.values())) == 1, versions

          package = distribution("fedbiomed")
          requires_python = package.metadata["Requires-Python"]
          assert requires_python, "Wheel metadata has no Requires-Python value"
          provided_extras = set(package.metadata.get_all("Provides-Extra") or ())
          assert {"node", "node-api", "gui", "researcher"} <= provided_extras, (
              f"Missing wheel extras: {provided_extras}"
          )
          console_scripts = {
              entry.name: entry.value
              for entry in package.entry_points
              if entry.group == "console_scripts"
          }
          assert console_scripts.get("fedbiomed") == "fedbiomed.cli:run"

          share_dir = Path(SHARE_DIR)
          required_shared_directories = (
              share_dir / "notebooks",
              share_dir / "docs" / "tutorials",
              share_dir / "envs" / "common",
          )
          for directory in required_shared_directories:
              assert directory.is_dir(), f"Missing shared directory: {directory}"
              assert any(directory.rglob("*")), f"Empty shared directory: {directory}"

          gui_root = Path(fedbiomed_gui.__file__).resolve().parent
          react_index = gui_root / "ui" / "build" / "index.html"
          assert react_index.is_file(), f"Missing React entry point: {react_index}"

          print(f"Requires-Python: {requires_python}")
          print(f"Shared data: {share_dir}")
          print(f"React entry point: {react_index}")
          PY

      - name: Record failed installation dependencies
        if: failure()
        run: |
          if [[ -n "${VENV_PYTHON:-}" && -x "$VENV_PYTHON" ]]; then
            "$VENV_PYTHON" -m pip freeze --all > wheel-dependencies.txt
          fi

      - name: Upload failed installation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: wheel-dependencies.txt
          if-no-files-found: ignore
          retention-days: 14
