---
name: Package Build Test
run-name: Package Build Test
description: |
  Builds all three distributions once, then checks isolated core, API, GUI, and
  researcher installations on every supported interpreter and runner. deploy.yml calls it on
  a tag, so publication to PyPI depends on it passing.

on:
  # Reusable release gate, also runnable manually or on the weekly schedule.
  workflow_call:
  workflow_dispatch:
  schedule:
    # Monday at 03:00 UTC.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  # Build once: every installation job and publication consumes these artifacts.
  build-package:
    name: Build packages (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python and PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install build tools
        run: python -m pip install build hatchling twine

      # Node.js/Yarn are needed only here, before Python packaging begins.
      - name: Build frontend explicitly
        working-directory: fedbiomed_gui/ui
        run: |
          yarn install --frozen-lockfile
          yarn build

      # Three projects produce six files. Each GUI artifact includes the bundle.
      - name: Build all wheels and source distributions
        run: |
          python -m build --no-isolation --outdir "$PWD/dist" .
          python -m build --no-isolation --outdir "$PWD/dist" fedbiomed_node_api
          python -m build --no-isolation --outdir "$PWD/dist" fedbiomed_gui

      # Twine checks metadata; the script checks coordinated versions, portable
      # requirements, and identical wheel contents after source-archive rebuilds.
      - name: Validate distributions and source rebuilds
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          python -m twine check dist/*
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            python scripts/verify_package_artifacts.py dist --expected-version "$RELEASE_REF_NAME"
          else
            python scripts/verify_package_artifacts.py dist
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedbiomed-package
          path: dist/
          if-no-files-found: error
          # Preserve the tested files long enough to retry a partial publication.
          retention-days: 14

  test-wheel:
    name: ${{ matrix.profile }} (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: build-package
    strategy:
      # Keep other scenarios running after a failure to collect their diagnostics.
      fail-fast: false
      matrix:
        # 4 profiles x 4 runners x 4 Python versions = 64 independent jobs.
        # Separate environments reveal dependencies accidentally supplied by extras.
        profile: [core, node-api, gui, researcher]
        os:
          - ubuntu-24.04
          - ubuntu-26.04
          - macos-latest
          - macos-m1
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup requested Python
        uses: ./.github/actions/setup-fbm-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: fedbiomed-package
          path: dist/

      - name: Install exact artifacts in a clean environment
        env:
          PACKAGE_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          VENV_DIR="$RUNNER_TEMP/fedbiomed-${PACKAGE_PROFILE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-py${{ matrix.python-version }}"
          "$FEDBIOMED_PYTHON_BIN" -m venv "$VENV_DIR"
          VENV_PYTHON="$VENV_DIR/bin/python"
          echo "VENV_PYTHON=$VENV_PYTHON" >> "$GITHUB_ENV"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          "$VENV_PYTHON" -m pip install --upgrade pip

          # Pin local URLs so an equal-version package on PyPI cannot be selected.
          "$VENV_PYTHON" - <<'PYTHON'
          import os
          from pathlib import Path
          from email.parser import BytesParser
          import zipfile
          directory = Path(os.environ["GITHUB_WORKSPACE"]) / "dist"
          lines = []
          for wheel in directory.glob("*.whl"):
              with zipfile.ZipFile(wheel) as archive:
                  metadata = BytesParser().parsebytes(archive.read(next(
                      name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
                  )))
              lines.append(f"{metadata['Name']} @ {wheel.as_uri()}")
          assert len(lines) == 3
          (Path(os.environ["RUNNER_TEMP"]) / "release-constraints.txt").write_text("\n".join(lines))
          PYTHON

          core_wheels=("$GITHUB_WORKSPACE"/dist/fedbiomed-*.whl)
          [[ ${#core_wheels[@]} -eq 1 && -f "${core_wheels[0]}" ]]
          requirement="${core_wheels[0]}"
          # Exercise installation shortcuts through core's extras: API brings
          # core+API, GUI brings core+API+GUI, researcher brings no web packages.
          if [[ "$PACKAGE_PROFILE" != core ]]; then
            requirement="${requirement}[${PACKAGE_PROFILE}]"
          fi
          # Installation must work with no frontend tools on PATH.
          PATH="$VENV_DIR/bin" "$VENV_PYTHON" -m pip install \
            --constraint "$RUNNER_TEMP/release-constraints.txt" "$requirement"

      # Run outside the checkout. -I also ignores PYTHONPATH and the script's
      # directory, preventing source imports from masking broken wheel contents.
      # Any failed job fails this reusable workflow and blocks its release callers.
      - name: Verify installed packages
        working-directory: ${{ runner.temp }}
        run: |
          "$VENV_PYTHON" -m pip check
          "$VENV_PYTHON" -I "$GITHUB_WORKSPACE/scripts/verify_installed_packages.py" \
            --profile "${{ matrix.profile }}" \
            --workspace "$GITHUB_WORKSPACE" \
            --expected-python "${{ matrix.python-version }}" \
            --dist-dir "$GITHUB_WORKSPACE/dist"

      # Save the resolved dependency set to diagnose runner/version-specific failures.
      - name: Record failed installation dependencies
        if: failure()
        run: |
          if [[ -n "${VENV_PYTHON:-}" && -x "$VENV_PYTHON" ]]; then
            "$VENV_PYTHON" -m pip freeze --all > wheel-dependencies.txt
          fi

      - name: Upload failed installation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.profile }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: wheel-dependencies.txt
          if-no-files-found: ignore
          retention-days: 14
