---
name: Codespell
description: |
  Checks repository spelling on every pull request and annotates the offending
  lines. Its word list and skip rules live in pyproject.toml.

on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Annotate locations with typos
        uses: codespell-project/codespell-problem-matcher@v1
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
