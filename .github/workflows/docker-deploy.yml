---
name: Tests and Publish Fed-BioMed Docker Images
description: |
  Builds the Fed-BioMed docker images. A push matching the triggers below (a
  version tag, or one of the watched branches) publishes them to Docker Hub.
  A pull request into master only test-builds it. A manual run builds
  whichever branch/ref it is launched on and can either test-build it or,
  with push enabled, publish it under the given tag. Every other trigger
  builds them as a test and publishes nothing.

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v1.2.3
    branches:
      - feature/multi-platform-docker-build
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      push:
        description: Publish the images to Docker Hub (requires "tag" below).
        required: false
        type: boolean
        default: false
      tag:
        description: |
          Docker tag for the images (e.g. "dev", "my-feature"). Used as the
          published tag when "push" is enabled; with "push" off, it just
          labels the local test build instead of the default branch/sha tags.
        required: false
        type: string

jobs:
  build-and-push:
    name: Build docker images and push to docker-hub
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.FBM_DOCKER_USERNAME }}
          password: ${{ secrets.FBM_DOCKER_TOKEN }}
     
      - name: Check if image has to be pushed
        id: test
        run: |
          # Any push event that reached this job already matched the
          # `on.push` filter above (a version tag, or a watched branch), so
          # it publishes. A pull request (into master) always test-builds,
          # regardless of the condition below. A manual run also publishes,
          # but only if explicitly asked to via the "push" input, and that
          # requires a "tag" too. Every other trigger builds without
          # pushing, so a trigger added later cannot reach Docker Hub by
          # omission.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "TEST_BUILD=false" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.push }}" == "true" ]]; then
            if [[ -z "${{ inputs.tag }}" ]]; then
              echo "::error::push is enabled but no tag was given; re-run with a tag input." >&2
              exit 1
            fi
            echo "TEST_BUILD=false" >> $GITHUB_OUTPUT
          else
            echo "TEST_BUILD=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and Publish/Test Fed-BioMed Base Image
        uses: ./.github/actions/docker-build-and-push
        with:
          image-names: fedbiomed/base
          file: docker/base/Dockerfile
          test: ${{ steps.test.outputs.TEST_BUILD }}
          image-tag: ${{ inputs.tag }}

      - name: Build and Publish/Test Fed-BioMed Node Image
        uses: ./.github/actions/docker-build-and-push
        with:
          image-names: fedbiomed/node
          file: docker/node/Dockerfile
          test: ${{ steps.test.outputs.TEST_BUILD }}
          image-tag: ${{ inputs.tag }}

      - name: Build and Publish/Test Researcher Image
        uses: ./.github/actions/docker-build-and-push
        with:
          image-names: fedbiomed/researcher
          file: docker/researcher/Dockerfile
          test: ${{ steps.test.outputs.TEST_BUILD }}
          image-tag: ${{ inputs.tag }}
