---
name: Temporary Python matrix validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  hosted-pr-matrix:
    uses: ./.github/workflows/fbm-generic-test.yml
    secrets: inherit
    with:
      python-versions: '["3.10","3.14"]'
      os-list: '["ubuntu-latest","macos-latest"]'
      run-docs: true
      run-unit: true
      run-mnist: true
      run-e2e: false