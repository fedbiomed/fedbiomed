---
name: Deploy Fed-BioMed Package
description: |
  Publishes the three verified distributions to PyPI, then creates the GitHub
  release with the same six artifacts. All package checks must pass first.
on:
  push:
    tags:
      - "*"

permissions:
  contents: read

# Serialize retries of a tag without cancelling an upload already in progress.
concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-compatibility:
    name: Build and test release packages
    uses: ./.github/workflows/package-compatibility.yml
    permissions:
      contents: read

  publish:
    name: Publish core, API, and GUI to PyPI
    runs-on: ubuntu-latest
    environment: production
    needs: package-compatibility
    permissions:
      id-token: write
    steps:
      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          name: fedbiomed-package
          path: ./dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Each project must trust deploy.yml / production. Uploads are not
        # atomic: rerun failed jobs with the same artifact to resume a partial upload.
        with:
          packages-dir: dist/
          skip-existing: true

  release:
    name: Release pushed tag
    runs-on: ubuntu-latest
    # Never announce a completed release while PyPI publication is still failing.
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest changes
        run: ./scripts/changelog

      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          name: fedbiomed-package
          path: ./dist/

      - name: Make Github Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fed-BioMed Release ${{ github.ref_name }}
          body_path: ./latest_version_changes.txt
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
