---
name: Deploy Fed-BioMed Package
description: |
  Publishes a tagged release to PyPI and opens the GitHub release. Both depend on
  package-compatibility.yml, so a failing package check blocks publication.
on:
  push:
    tags:
      - "fedbiomed/v*"
      - "node-api/v*"
      - "node-ui/v*"
      - "stack/v*"

permissions:
  contents: read

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.parse.outputs.target }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse and validate release tag and version
        id: parse
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          # Validate tag format and extract target and version
          tag = os.environ["TAG"]
          match = re.fullmatch(
              r"(fedbiomed|node-api|node-ui|stack)/v(\d+\.\d+\.\d+)",
              tag,
          )
          if not match:
              raise SystemExit(f"Invalid release tag: {tag}")

          target, expected_version = match.groups()

          # Read versions from package metadata.
          with open("packages/node-api/pyproject.toml", "rb") as f:
              api_version = tomllib.load(f)["project"]["version"]

          with open("packages/node-ui/pyproject.toml", "rb") as f:
              ui_version = tomllib.load(f)["project"]["version"]

          core_init = Path(
              "packages/fedbiomed/src/fedbiomed/__init__.py"
          ).read_text()

          core_match = re.search(
              r'^__version__\s*=\s*["\']v?(\d+\.\d+\.\d+)["\']',
              core_init,
              re.MULTILINE,
          )
          if not core_match:
              raise SystemExit("Cannot determine core version")

          versions = {
              "fedbiomed": core_match.group(1),
              "node-api": api_version,
              "node-ui": ui_version,
          }

          # Validate that all versions have the same major version
          majors = {version.split(".")[0] for version in versions.values()}
          if len(majors) != 1:
              raise SystemExit(f"Major version mismatch: {versions}")

          selected = (
              versions.values()
              if target == "stack"
              else [versions[target]]
          )

          # Validate that the selected version matches the expected version from the tag
          for actual in selected:
              if actual != expected_version:
                  raise SystemExit(
                      f"Tag {tag} expects {expected_version}, "
                      f"but package version is {actual}"
                  )

          print(f"Validated release: {tag}")
          PY

          TARGET="${TAG%%/*}"
          VERSION="${TAG#*/v}"

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  package-compatibility:
    needs: release-info
    name: Build and test release package
    uses: ./.github/workflows/package-compatibility.yml
    permissions:
      contents: read          

  # Independent release: publish ONLY the selected distribution.
  publish-single:
    name: Publish selected package
    needs: [release-info, package-compatibility]
    if: needs.release-info.outputs.target != 'stack'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@v4
        with:
          name: fedbiomed-package
          path: dist/

      - name: Select distribution
        shell: bash
        env:
          TARGET: ${{ needs.release-info.outputs.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          case "$TARGET" in
            fedbiomed) PREFIX="fedbiomed" ;;
            node-api)  PREFIX="fedbiomed_node_api" ;;
            node-ui)   PREFIX="fedbiomed_gui" ;;
            *) echo "Invalid target: $TARGET" >&2; exit 1 ;;
          esac

          wheels=(dist/"${PREFIX}"-*.whl)
          sdists=(dist/"${PREFIX}"-*.tar.gz)

          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1

          mkdir -p publish-dist
          cp "${wheels[0]}" "${sdists[0]}" publish-dist/

          ls -lh publish-dist/

      - name: Publish selected distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/

  # Coordinated MAJOR release: Core -> API -> GUI.
  publish-stack-core:
    name: Publish stack - Core
    needs: [release-info, package-compatibility]
    if: needs.release-info.outputs.target == 'stack'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fedbiomed-package
          path: dist/

      - name: Select Core distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/fedbiomed-*.whl)
          sdists=(dist/fedbiomed-*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          mkdir -p publish-dist
          cp "${wheels[0]}" "${sdists[0]}" publish-dist/

      - name: Publish Core
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/

  publish-stack-api:
    name: Publish stack - Node API
    needs: [release-info, publish-stack-core]
    if: needs.release-info.outputs.target == 'stack'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fedbiomed-package
          path: dist/

      - name: Select API distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/fedbiomed_node_api-*.whl)
          sdists=(dist/fedbiomed_node_api-*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          mkdir -p publish-dist
          cp "${wheels[0]}" "${sdists[0]}" publish-dist/

      - name: Publish Node API
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/

  publish-stack-gui:
    name: Publish stack - GUI
    needs: [release-info, publish-stack-api]
    if: needs.release-info.outputs.target == 'stack'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fedbiomed-package
          path: dist/

      - name: Select GUI distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/fedbiomed_gui-*.whl)
          sdists=(dist/fedbiomed_gui-*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          mkdir -p publish-dist
          cp "${wheels[0]}" "${sdists[0]}" publish-dist/

      - name: Publish GUI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/

  # Create release only after the relevant PyPI publication succeeds.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release-info
      - package-compatibility
      - publish-single
      - publish-stack-gui

    if: >-
      ${{
        always() &&
        needs.release-info.result == 'success' &&
        needs.package-compatibility.result == 'success' &&
        (
          (
            needs.release-info.outputs.target != 'stack' &&
            needs.publish-single.result == 'success'
          ) ||
          (
            needs.release-info.outputs.target == 'stack' &&
            needs.publish-stack-gui.result == 'success'
          )
        )
      }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true

  # Documentation is deployed only after a successful Core/stack release.
  documentation:
    name: Deploy release documentation
    needs: [release-info, release]
    if: >-
      ${{
        needs.release.result == 'success' &&
        (
          needs.release-info.outputs.target == 'fedbiomed' ||
          needs.release-info.outputs.target == 'stack'
        )
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-and-deploy-documentation.yml
    with:
      version: ${{ needs.release-info.outputs.version }}
      alias: latest
    secrets: inherit
