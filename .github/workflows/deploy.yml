---
name: Deploy Fed-BioMed Package
description: |
  Publishes all three packages in dependency order, then opens the GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse and validate release tag and version
        id: parse
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          # Validate tag format and extract target and version
          tag = os.environ["TAG"]
          match = re.fullmatch(
              r"v(\d+\.\d+\.\d+)",
              tag,
          )
          if not match:
              raise SystemExit(f"Invalid release tag: {tag}")

          expected_version = match.group(1)

          # Read versions from package metadata.
          with open("packages/node-api/pyproject.toml", "rb") as f:
              api_version = tomllib.load(f)["project"]["version"]

          with open("packages/node-ui/pyproject.toml", "rb") as f:
              ui_version = tomllib.load(f)["project"]["version"]

          core_init = Path(
              "packages/fedbiomed/src/fedbiomed/__init__.py"
          ).read_text()

          core_match = re.search(
              r'^__version__\s*=\s*["\']v?(\d+\.\d+\.\d+)["\']',
              core_init,
              re.MULTILINE,
          )
          if not core_match:
              raise SystemExit("Cannot determine core version")

          versions = {
              "fedbiomed": core_match.group(1),
              "node-api": api_version,
              "node-ui": ui_version,
          }

          for actual in versions.values():
              if actual != expected_version:
                  raise SystemExit(
                      f"Tag {tag} expects unified version {expected_version}, "
                      f"but package version is {actual}"
                  )

          print(f"Validated release: {tag}")
          PY

          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-packages:
    name: Build all distributions
    needs: release-info
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install build tools
        run: |
          python -m pip install --upgrade build twine
          npm install --global yarn@1.22.22
      - name: Build packages
        run: |
          mkdir -p dist
          python -m build --wheel --sdist packages/fedbiomed --outdir dist
          python -m build --wheel --sdist packages/node-api --outdir dist
          python -m build --wheel --sdist packages/node-ui --outdir dist
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: fedbiomed-release-distributions
          path: dist/
          if-no-files-found: error

  publish-core:
    name: Publish Core
    needs: build-packages
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fedbiomed-release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-api:
    name: Publish Node API
    needs: publish-core
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fedbiomed-release-distributions
          path: downloaded/
      - name: Select API distributions
        run: |
          mkdir publish-dist
          cp downloaded/fedbiomed_node_api-* publish-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/
          skip-existing: true

  publish-ui:
    name: Publish Node UI
    needs: publish-api
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fedbiomed-release-distributions
          path: downloaded/
      - name: Select UI distributions
        run: |
          set -euo pipefail
          mkdir publish-dist
          cp downloaded/fedbiomed_gui-* publish-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/
          skip-existing: true

  release:
    name: Create GitHub Release
    needs: [release-info, publish-core, publish-api, publish-ui]
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() &&
        needs.release-info.result == 'success' &&
        needs.publish-core.result == 'success' &&
        needs.publish-api.result == 'success' &&
        needs.publish-ui.result == 'success'
      }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true

  documentation:
    name: Deploy release documentation
    needs: [release-info, release]
    if: needs.release.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/build-and-deploy-documentation.yml
    with:
      version: ${{ needs.release-info.outputs.version }}
      alias: latest
    secrets: inherit
