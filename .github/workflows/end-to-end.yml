---
name: End-to-End Test
run-name: fedbiomed-e2e-tests
description: |
  Runs the ordinary end-to-end suite, one job per test file, on a weekday
  schedule and on every push to master.

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'JSON list of Python versions, e.g. ["3.12"]; empty uses 3.11 and 3.14'
        required: false
        type: string
      os:
        description: 'JSON list of runner labels, e.g. ["ubuntu-latest"]; empty uses all four targets'
        required: false
        type: string
  schedule:
    # Monday to Friday at 23:00 UTC.
    - cron: "0 23 * * 1-5"
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-test-auto:
    name: Run ordinary end-to-end tests
    uses: ./.github/workflows/fbm-generic-test.yml
    secrets: inherit
    with:
      python-versions: ${{ github.event.inputs.python-version || '["3.11","3.14"]' }}
      os-list: ${{ github.event.inputs.os || '["ubuntu-latest","ubuntu-24-04","macos-latest","macos-m1"]' }}
      run-e2e: true
