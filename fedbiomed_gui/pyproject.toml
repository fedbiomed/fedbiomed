[project]
name = "fedbiomed-gui"
dynamic = ["version"]
description = "Fed-BioMed Node graphical user interface"
requires-python = "<3.12,>=3.10"
license = { text = "Apache 2.0" }
dependencies = [
    "fedbiomed[node]>=6.3.3,<7",
    "flask>=2.3.1,<24.0",
    "jsonschema~=4.18.0",
    "Flask-JWT-Extended>=4.4.4,<4.5.0",
    "cachelib>=0.10.2,<0.11.0",
    "gunicorn~=23.0.0",
    "tinydb~=4.7.1",
]

[project.urls]
Homepage = "https://fedbiomed.org"
Documentation = "https://fedbiomed.org"
Repository = "https://github.com/fedbiomed/fedbiomed"

[tool.hatch.version]
path = "__init__.py"

[tool.hatch.build]
dev-mode-dirs = [".."]

# File-selection paths are relative to this pyproject.toml.
[tool.hatch.build.targets.sdist]
only-include = [
    "__init__.py",
    "config_gui.ini",
    "server",
    "ui",
    "hatch_build.py",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "config_gui.ini",
    "server",
]
artifacts = ["ui/build"]

[tool.hatch.build.targets.wheel.sources]
"" = "fedbiomed_gui"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
