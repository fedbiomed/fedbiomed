[project]
name = "fedbiomed-gui"
version = "6.4.1"
description = "Fed-BioMed Node GUI launcher and frontend"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = {text = "Apache 2.0"}
dependencies = ["fedbiomed-node-api==6.4.1"]

[project.urls]
Homepage = "https://fedbiomed.org"
Repository = "https://github.com/fedbiomed/fedbiomed"

[project.scripts]
fedbiomed-gui = "fedbiomed_gui.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Sources live directly in this project directory, so editable imports use its parent.
dev-mode-dirs = [".."]
exclude = ["__pycache__", "*.pyc", "node_modules"]
artifacts = ["/ui/build/**"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "cli.py", "server", "ui/build"]

[tool.hatch.build.targets.wheel.sources]
"" = "fedbiomed_gui"

[tool.hatch.build.targets.sdist]
include = [
    "/__init__.py",
    "/cli.py",
    "/server",
    "/hatch_build.py",
    "/ui/package.json",
    "/ui/yarn.lock",
    "/ui/public",
    "/ui/src",
]
