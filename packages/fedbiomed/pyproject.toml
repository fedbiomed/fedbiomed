keywords = [
	"learning",
	"ai",
	"analytics",
	"clinical",
	"collaborative",
	"federated",
	"biomedical",
	"healthcare",
	"multicentric",
]

classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Science/Research",
	"Intended Audience :: Healthcare Industry",
	"License :: OSI Approved :: Apache Software License",
	"Natural Language :: English",
	"Operating System :: Unix",
	"Operating System :: MacOS",
	"Programming Language :: Python :: 3",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
	"tinydb ~=4.7.1",
	"tabulate >=0.9.0,<0.10.0",
	"psutil ~=6.0.0",
	"requests  ~=2.29",
	"packaging   ~=24.1",
	"cryptography ~=42.0",
	"joblib  ~=1.2",
	"itk  !=5.4.4,>=5.3.0",
	"scipy  >=1.10.0",
	"scikit-learn  >=1.2.0",
	"torch  >=1.13.0",
	"torchvision  >=0.14.0",
	"opacus  !=1.5.4,>=1.4.0",
	"monai  >=1.1.0",
	"msgpack  ~=1.0",
	"persist-queue  >=0.5.1,<0.6.0",
	"pandas  >=2.0.1",
	"polars ~=1.32.0",
	"python-minifier  >=2.11,<=3.2.0",
	"declearn[torch]  >=2.9, <2.10",
	"gmpy2  >=2.1.2,<=2.3.1",
	"grpcio  ~=1.82.0",
	"grpcio-tools  ~=1.82.0",
	"unet  >=0.7.7,<0.8.0",
	"pygments ~=2.18.0",
	"nibabel ~=5.3",
	"pyarrow>=21.0.0",
]

requires-python = "<3.15,>=3.11"
license = {text = "Apache 2.0"}

[project.urls]
Homepage = "https://fedbiomed.org"
Documentation = "https://fedbiomed.org"
Repository = "https://github.com/fedbiomed/fedbiomed"

[tool.hatch.version]
path = "src/__init__.py"


[project.optional-dependencies]  # This is optional dependencies
node = [
]

researcher = [
	"pathvalidate ~=3.0.0",
	"matplotlib >=3.8.0",
	"setuptools <81",
	"tensorboard ~=2.18.0",
	"jupyter",
	"ipython"
]

node-api = ["fedbiomed-node-api==6.4.1"]
gui = ["fedbiomed-gui==6.4.1"]


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"
readme = "README.md"

[tool.hatch.build.hooks.custom]

# Files copied from the repository root into the source archive.
[tool.hatch.build.hooks.custom.sdist-files]
"README.md" = "README.md"

# Paths are relative to the repository root, or the extracted source archive.
# The hook resolves them before passing them to Hatch's shared-data mechanism.
[tool.hatch.build.hooks.custom.shared-data]
"docs/tutorials" = "share/fedbiomed/docs/tutorials"
"envs/common" = "share/fedbiomed/envs/common"
"notebooks" = "share/fedbiomed/notebooks"

[tool.hatch.build.targets.sdist]
include = ["/src", "/hatch_build.py", "/LICENSE.md"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "fedbiomed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
fedbiomed = "fedbiomed.cli:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "strict"
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"
extend-exclude = ["envs", "*.ipynb", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
unfixable = ["B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
