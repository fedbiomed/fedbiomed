[project]
name = "fedbiomed-development"
version = "0.0.0"
requires-python = ">=3.11,<3.15"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
    "mkdocs-jupyter>=0.24",
    "mkdocstrings-python>=1.10.8",
    "mkdocs-minify-plugin",
    "mkdocs-redirects",
    "mike",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
]
dev = [
    "ruff==0.11.13",
    "pre-commit>=4.2.0",
]

[tool.pdm]
distribution = false

[tool.pdm.workspace]
members = [
    "packages/fedbiomed",
    "packages/node-api",
    "packages/node-ui",
]
